<!DOCTYPE html>
<html>
<head>
  <title>Gate Entry Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://unpkg.com/html5-qrcode"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
      transition: background 0.3s ease;
    }
    #reader {
      width: 300px;
      margin: auto;
    }
  </style>
</head>

<body>

<h3>🎫 Gate Entry Scanner</h3>

<div id="reader"></div>

<div class="mt-3">
  <div id="result"></div>
  <div id="count" class="fw-bold mt-2"></div>
</div>

<audio id="successSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

<script>

let html5QrCode;

function resetScreen() {
  setTimeout(() => {
    document.body.style.background = "#111";
    document.getElementById("result").innerHTML = "";
  }, 3000);
}

function startScanner() {

  html5QrCode = new Html5Qrcode("reader");

  html5QrCode.start(
    { facingMode: { exact: "environment" } },
    {
      fps: 10,
      qrbox: 250
    },
    onScanSuccess
  ).catch(err => {
    console.log("Back camera not available, trying default...");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      onScanSuccess
    );
  });
}

function onScanSuccess(decodedText) {

  let enrollment;

  try {
    enrollment = atob(decodedText).trim();
  } catch {
    enrollment = decodedText.trim();
  }

  fetch("/api/scan", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ enrollment })
  })
  .then(res => res.json())
  .then(data => {

    if (data.status === "success") {

      document.body.style.background = "green";
      document.getElementById("successSound").play();

      document.getElementById("result").innerHTML =
        `<div class="alert alert-success">
          <h5>✅ Entry Allowed</h5>
          <p><strong>Name:</strong> ${data.name}</p>
          <p><strong>Enrollment:</strong> ${data.enrollment}</p>
          <p><strong>Time:</strong> ${new Date(data.time).toLocaleString()}</p>
        </div>`;

    }
    else if (data.status === "duplicate") {

      document.body.style.background = "orange";

      document.getElementById("result").innerHTML =
        `<div class="alert alert-warning">
          <h5>⚠ Already Entered</h5>
          <p><strong>Name:</strong> ${data.name}</p>
          <p><strong>First Entry:</strong> ${new Date(data.time).toLocaleString()}</p>
        </div>`;

    }
    else {

      document.body.style.background = "red";

      document.getElementById("result").innerHTML =
        `<div class="alert alert-danger">
          ❌ Invalid Student
        </div>`;
    }

    document.getElementById("count").innerText =
      "Total Entries: " + (data.total || 0);

    resetScreen();
  });
}

startScanner();

</script>

</body>
</html>
