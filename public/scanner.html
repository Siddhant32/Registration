<!DOCTYPE html>
<html>
<head>
<title>Event Entry Scanner</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/html5-qrcode"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color: white;
  text-align:center;
  padding:20px;
}

.card {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  border-radius:20px;
  padding:20px;
  margin:auto;
  max-width:400px;
}

#reader {
  border-radius:15px;
  overflow:hidden;
}

.success {
  color:#00ff88;
  font-weight:bold;
  font-size:20px;
}

.error {
  color:#ff4d4d;
  font-weight:bold;
  font-size:20px;
}
</style>
</head>

<body>

<h2 class="mb-3">🎉 Event Entry Scanner</h2>

<div class="card">

<h5>Total Entered</h5>
<h2 id="count">0</h2>

<div id="reader" class="mb-3"></div>

<div id="result"></div>

</div>
<script>

let scanner;

function onScanSuccess(decodedText) {

  scanner.clear();

  let enrollment;

  try {
    enrollment = atob(decodedText);
  } catch {
    document.getElementById("result").innerHTML =
      "<div class='error'>Invalid QR ❌</div>";
    setTimeout(startScanner, 3000);
    return;
  }

  fetch("/api/scan", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ enrollment })
  })
  .then(res => res.json())
  .then(data => {

    const result = document.getElementById("result");
    const count = document.getElementById("count");

    if (data.success) {

      result.innerHTML = `
        <div class="success">
          Entry Allowed ✅ <br>
          ${data.student.name}
        </div>
      `;

      count.innerText = data.total;

    } else {

      result.innerHTML = `
        <div class="error">
          ${data.message}
        </div>
      `;

    }

    setTimeout(startScanner, 4000);

  });

}

function startScanner() {
  scanner = new Html5QrcodeScanner(
    "reader",
    { fps: 10, qrbox: 250 }
  );
  scanner.render(onScanSuccess);
}

startScanner();

</script>


</body>
</html>
