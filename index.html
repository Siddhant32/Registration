<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Verified Registration with QR</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
}
.glass-card {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 30px;
    color: white;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
}
#qrcode img {
    padding: 10px;
    background: white;
    border-radius: 12px;
}
</style>
</head>

<body>

<div class="container">
<div class="row justify-content-center">
<div class="col-lg-6">
<div class="glass-card">

<h3 class="text-center mb-4">
<i class="bi bi-shield-check"></i> Verified Student Registration
</h3>

<form>
<div class="mb-3">
<label>Name</label>
<input type="text" id="name" class="form-control"
oninput="this.value=this.value.toLowerCase()" required>
</div>

<div class="mb-3">
<label>Enrollment Number</label>
<input type="text" id="enrollment" class="form-control"
pattern="[0-9]+" inputmode="numeric" required>
</div>

<div class="mb-3">
<label>Department</label>
<select id="branch" class="form-select" required>
<option value="">-- Select Department --</option>
<option value="Computer Engineering">Computer Engineering</option>
<option value="Information Technology Engineering">Information Technology Engineering</option>
<option value="Mechanical Engineering">Mechanical Engineering</option>
<option value="Civil Engineering">Civil Engineering</option>
<option value="Chemical Engineering">Chemical Engineering</option>
<option value="Travel and Tourism Engineering">Travel and Tourism Engineering</option>
</select>
</div>

<button type="button" onclick="generateQR()" 
class="btn btn-light w-100 fw-bold">
Generate QR
</button>
</form>

<div class="text-center mt-4">
<div id="message"></div>
<div id="qrcode" class="mt-3 d-flex justify-content-center"></div>
</div>

</div>
</div>
</div>
</div>

<script>

async function generateQR() {

document.getElementById("qrcode").innerHTML = "";
document.getElementById("message").innerHTML = "";

let name = document.getElementById("name").value.trim();
let enrollment = document.getElementById("enrollment").value.trim();
let branch = document.getElementById("branch").value.trim();

if(name === "" || enrollment === "" || branch === ""){
    showMessage("Please fill all fields!", "danger");
    return;
}

if(!/^[0-9]+$/.test(enrollment)){
    showMessage("Enrollment must contain only numbers!", "danger");
    return;
}

const response = await fetch("/api/verify", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({ name, enrollment, branch })
});

const result = await response.json();

if(result.success){

    let uniqueID = "STU-" + enrollment + "-" + Date.now();

    new QRCode(document.getElementById("qrcode"), {
        text: uniqueID,
        width: 200,
        height: 200
    });

    showMessage("Student Verified! QR Generated ✅", "success");

}else{
    showMessage("Student Not Found ❌", "danger");
}
}

function showMessage(text, type){
document.getElementById("message").innerHTML =
`<div class="alert alert-${type}">${text}</div>`;
}

</script>

</body>
</html>
