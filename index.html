<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modern Registration with QR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- QR Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            color: white;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        }

        .form-control {
            border-radius: 12px;
        }

        .btn-modern {
            border-radius: 12px;
            transition: 0.3s;
        }

        .btn-modern:hover {
            transform: scale(1.05);
        }

        #qrcode img {
            padding: 10px;
            background: white;
            border-radius: 12px;
        }

        @media (max-width: 576px) {
            .glass-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 col-sm-12">
            <div class="glass-card">

                <h3 class="text-center mb-4">
                    <i class="bi bi-person-badge-fill"></i> Student Registration<br>
                    Govt Poly Thne
                </h3>

                <form>
                    <div class="mb-3">
                        <label class="form-label">
                            <i class="bi bi-person-fill"></i> Name
                        </label>
                        <input type="text" id="name" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            <i class="bi bi-card-text"></i> Enrollment Number
                        </label>
                        <input type="text" id="enrollment" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            <i class="bi bi-diagram-3-fill"></i> Branch
                        </label>
                        <input type="text" id="branch" class="form-control" required>
                    </div>

                    <button type="button" onclick="generateQR()" 
                        class="btn btn-light text-dark w-100 btn-modern fw-bold">
                        <i class="bi bi-qr-code"></i> Register & Generate QR
                    </button>
                </form>

                <div class="text-center mt-4">
                    <div id="qrcode" class="mt-3 d-flex justify-content-center"></div>
                </div>

            </div>
        </div>
    </div>
</div>

<script>

// Generate Unique ID (hidden)
function generateUniqueID() {
    const timestamp = Date.now();
    const random = Math.floor(Math.random() * 1000);
    return "STU-" + timestamp + "-" + random;
}

function generateQR() {

    document.getElementById("qrcode").innerHTML = "";

    var name = document.getElementById("name").value;
    var enrollment = document.getElementById("enrollment").value;
    var branch = document.getElementById("branch").value;

    if(name === "" || enrollment === "" || branch === "") {
        alert("Please fill all fields!");
        return;
    }

    // Generate hidden Unique ID
    var uniqueID = generateUniqueID();

    // Only embed ID inside QR (not showing on screen)
    new QRCode(document.getElementById("qrcode"), {
        text: uniqueID,
        width: 200,
        height: 200
    });

}

</script>

</body>
</html>
